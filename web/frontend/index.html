<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokemon Red RL — Live Training Map</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --text: #e6e8ee;
      --muted: #8a90a0;
      --accent: #e3350d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: color-mix(in srgb, var(--panel) 85%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #262a33;
      z-index: 10;
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    header h1 span { color: var(--accent); }
    #conn {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #conn::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #666;
      display: inline-block;
    }
    #conn.ok::before { background: #3fb950; }
    #conn.err::before { background: var(--accent); }
    #stats { font-size: 12px; color: var(--muted); }
    #controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    #train-state { font-size: 12px; color: var(--muted); min-width: 90px; text-align: right; }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: var(--accent);
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.5; cursor: default; }
    button.stop { background: #30363d; }
    #log-toggle { background: #30363d; padding: 7px 10px; }
    #map { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #map.dragging { cursor: grabbing; }
    #hint {
      position: fixed;
      bottom: 12px; left: 16px;
      font-size: 12px;
      color: var(--muted);
      z-index: 10;
    }
    #log {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 34vh;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border-top: 1px solid #262a33;
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #b9c0cc;
      white-space: pre-wrap;
      z-index: 9;
      display: none;
    }
    #log.open { display: block; }
    .drawer {
      position: fixed;
      top: 48px; right: 0;
      width: 320px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: color-mix(in srgb, var(--panel) 96%, transparent);
      border-left: 1px solid #262a33;
      backdrop-filter: blur(8px);
      padding: 16px;
      z-index: 8;
      transform: translateX(100%);
      transition: transform 0.15s ease;
    }
    .drawer.open { transform: translateX(0); }
    .drawer h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select {
      width: 100%;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: #0f1115;
      border: 1px solid #30363d;
      border-radius: 5px;
      padding: 6px 8px;
    }
    .field.inline { display: flex; align-items: center; gap: 8px; }
    .field.inline input { width: auto; }
    .field.inline label { margin: 0; }
    .field input[type="range"] { padding: 0; accent-color: var(--accent); }
    .field-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .field label b { color: var(--text); }
    #run-list { list-style: none; margin: 0; padding: 0; font-size: 12px; }
    #run-list li { padding: 8px 0; border-bottom: 1px solid #262a33; }
    .run-id { font-family: ui-monospace, monospace; color: var(--text); }
    .run-status { float: right; font-weight: 600; }
    .run-status.running { color: #d29922; }
    .run-status.stopped { color: #58a6ff; }
    .run-status.exited { color: #3fb950; }
    .run-status.failed { color: var(--accent); }
    .run-meta { color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Pokemon Red RL <span>●</span> Live Training Map</h1>
    <div id="conn">connecting…</div>
    <div id="stats"></div>
    <div id="controls">
      <span id="train-state">idle</span>
      <button id="config-toggle" title="Launch settings">config</button>
      <button id="runs-toggle" title="Run history">runs</button>
      <button id="log-toggle" title="Toggle training log">log</button>
      <button id="train-btn">Train</button>
    </div>
  </header>
  <canvas id="map"></canvas>
  <div id="hint">drag to pan · scroll to zoom</div>

  <aside id="config-panel" class="drawer">
    <h2>Launch settings</h2>
    <div class="field">
      <label for="cfg-device">Device</label>
      <select id="cfg-device"><option value="cpu">cpu</option><option value="mps">mps</option></select>
    </div>
    <div class="field">
      <label for="cfg-instances">instances (parallel workers): <b id="cfg-instances-val">12</b></label>
      <input id="cfg-instances" type="range" min="1" max="12" step="1" value="12">
      <div class="field-hint" id="cfg-instances-hint"></div>
    </div>
    <div class="field"><label for="cfg-total-timesteps">total_timesteps</label><input id="cfg-total-timesteps" type="number" min="1"></div>
    <div class="field"><label for="cfg-wrappers">wrappers</label><select id="cfg-wrappers"></select></div>
    <div class="field"><label for="cfg-reward">reward</label><select id="cfg-reward"></select></div>
    <div class="field inline"><input id="cfg-debug" type="checkbox"><label for="cfg-debug">debug (single env, fast boot)</label></div>
  </aside>

  <aside id="runs-panel" class="drawer">
    <h2>Run history</h2>
    <ul id="run-list"></ul>
  </aside>

  <pre id="log"></pre>
  <script src="app.js"></script>
</body>
</html>
